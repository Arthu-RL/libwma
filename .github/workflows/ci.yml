name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    shell: bash

jobs:
  linux-debug-build:
    name: Linux Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # Mirrors CMakePresets.json's "linux-debug" preset rather than using
        # it directly, since that preset's CMAKE_PREFIX_PATH is wired through
        # $env{LOCAL_PREFIX}, which isn't set to anything useful here.
        run: >
          cmake -S . -B build/linux/debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=ON
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_X11=ON
          -DWMA_ENABLE_WAYLAND=ON

      - name: Build
        run: cmake --build build/linux/debug --parallel

      - name: Run tests
        run: ctest --test-dir build/linux/debug --output-on-failure

  linux-release-build:
    name: Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # See linux-debug-build's Configure step for why this mirrors the
        # "linux-release" preset instead of using it directly.
        run: >
          cmake -S . -B build/linux/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=ON
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_X11=ON
          -DWMA_ENABLE_WAYLAND=ON

      - name: Build
        run: cmake --build build/linux/release --parallel

      - name: Run tests
        run: ctest --test-dir build/linux/release --output-on-failure

  backend-matrix-build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdl-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=ON -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=OFF
          - name: glfw-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=ON
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=OFF
          - name: x11-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=ON -DWMA_ENABLE_WAYLAND=OFF
          - name: wayland-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

  wasm-build:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DWMA_BUILD_EXAMPLES=ON \
            -DWMA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="/usr/local/wasm;/usr/local" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build-wasm --parallel

  android-build:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DANDROID_STL=c++_shared
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="/usr/local/android;/usr/local"
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: cmake --build build-android --parallel
